
spring.application.name=trustvault

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TrustVault;encrypt=true;trustServerCertificate=true
spring.datasource.username=trustvault_app
spring.datasource.password=${TRUSTVAULT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8081
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
