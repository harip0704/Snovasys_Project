
spring.application.name=trustvault

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TrustVault;encrypt=true;trustServerCertificate=true
spring.datasource.username=trustvault_app
spring.datasource.password=${TRUSTVAULT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8081
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
trustvault.aws.region=${AWS_REGION:ap-south-1}
trustvault.aws.bucket=${AWS_S3_BUCKET}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GitHub OAuth2 Login
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email